components:
  schemas:
    AppareilNotificationInputRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
        plateforme:
          default: ''
          oneOf:
          - $ref: '#/components/schemas/PlateformeEnum'
          - $ref: '#/components/schemas/BlankEnum'
      required:
      - token
    BatchTransactionItemRequest:
      type: object
      description: Un élément d'une soumission par lot (texte uniquement — pas d'image/audio
        en lot pour l'instant).
      properties:
        text:
          type: string
          minLength: 1
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          default: MOBILE
        client_ref:
          type: string
      required:
      - text
    BatchTransactionPayloadRequest:
      type: object
      description: Validation d'une soumission par lot (app mobile hors-ligne -> sync).
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/BatchTransactionItemRequest'
      required:
      - transactions
    BlankEnum:
      enum:
      - ''
    Devis:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reference:
          type: string
          readOnly: true
        entreprise:
          type: string
          format: uuid
          readOnly: true
        client:
          type: string
          format: uuid
          nullable: true
        client_nom:
          type: string
          readOnly: true
        date_emission:
          type: string
          format: date
          readOnly: true
        date_validite:
          type: string
          format: date
          nullable: true
        montant_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        statut:
          $ref: '#/components/schemas/DevisStatutEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        lignes:
          type: array
          items:
            $ref: '#/components/schemas/LigneDevis'
          readOnly: true
      required:
      - client_nom
      - created_at
      - date_emission
      - entreprise
      - id
      - lignes
      - montant_total
      - reference
      - updated_at
    DevisRequest:
      type: object
      properties:
        client:
          type: string
          format: uuid
          nullable: true
        date_validite:
          type: string
          format: date
          nullable: true
        statut:
          $ref: '#/components/schemas/DevisStatutEnum'
    DevisStatutEnum:
      enum:
      - BROUILLON
      - VALIDE
      - FACTURE
      - ANNULE
      type: string
      description: |-
        * `BROUILLON` - Brouillon
        * `VALIDE` - Validé
        * `FACTURE` - Transformé en Facture
        * `ANNULE` - Annulé
    EcheanceFiscale:
      type: object
      description: Serializer des échéances fiscales avec leurs pièces justificatives.
      properties:
        id:
          type: integer
          readOnly: true
        type_echeance:
          $ref: '#/components/schemas/TypeEcheanceEnum'
        libelle:
          type: string
          maxLength: 255
        date_echeance:
          type: string
          format: date
        periode:
          type: string
          nullable: true
          description: Période fiscale au format YYYY-MM
          maxLength: 7
        montant_taxe:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        statut:
          $ref: '#/components/schemas/EcheanceFiscaleStatutEnum'
        dernier_rappel_envoye:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        date_paiement:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        pieces_justificatives:
          type: object
          additionalProperties: {}
          readOnly: true
      required:
      - date_echeance
      - date_paiement
      - dernier_rappel_envoye
      - id
      - libelle
      - pieces_justificatives
      - type_echeance
    EcheanceFiscaleRequest:
      type: object
      description: Serializer des échéances fiscales avec leurs pièces justificatives.
      properties:
        type_echeance:
          $ref: '#/components/schemas/TypeEcheanceEnum'
        libelle:
          type: string
          minLength: 1
          maxLength: 255
        date_echeance:
          type: string
          format: date
        periode:
          type: string
          nullable: true
          description: Période fiscale au format YYYY-MM
          maxLength: 7
        montant_taxe:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        statut:
          $ref: '#/components/schemas/EcheanceFiscaleStatutEnum'
      required:
      - date_echeance
      - libelle
      - type_echeance
    EcheanceFiscaleStatutEnum:
      enum:
      - EN_ATTENTE
      - RAPPELE
      - PAYE
      - EN_RETARD
      type: string
      description: |-
        * `EN_ATTENTE` - En attente
        * `RAPPELE` - Rappel envoyé
        * `PAYE` - Payé
        * `EN_RETARD` - En retard
    LigneDevis:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        description:
          type: string
          description: Description du produit ou service
        quantite:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        prix_unitaire:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        montant_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - description
      - id
      - montant_total
    LigneDevisRequest:
      type: object
      properties:
        description:
          type: string
          minLength: 1
          description: Description du produit ou service
        quantite:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        prix_unitaire:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - description
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        titre:
          type: string
          maxLength: 150
        message:
          type: string
        palier:
          oneOf:
          - $ref: '#/components/schemas/PalierEnum'
          - $ref: '#/components/schemas/BlankEnum'
        echeance:
          type: integer
          nullable: true
        lue:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - message
      - titre
    PalierEnum:
      enum:
      - J10
      - J5
      - J1
      - J0
      - RETARD
      type: string
      description: |-
        * `J10` - 10 jours avant
        * `J5` - 5 jours avant
        * `J1` - 1 jour avant
        * `J0` - Jour J
        * `RETARD` - Échéance dépassée
    PatchedDevisRequest:
      type: object
      properties:
        client:
          type: string
          format: uuid
          nullable: true
        date_validite:
          type: string
          format: date
          nullable: true
        statut:
          $ref: '#/components/schemas/DevisStatutEnum'
    PatchedEcheanceFiscaleRequest:
      type: object
      description: Serializer des échéances fiscales avec leurs pièces justificatives.
      properties:
        type_echeance:
          $ref: '#/components/schemas/TypeEcheanceEnum'
        libelle:
          type: string
          minLength: 1
          maxLength: 255
        date_echeance:
          type: string
          format: date
        periode:
          type: string
          nullable: true
          description: Période fiscale au format YYYY-MM
          maxLength: 7
        montant_taxe:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        statut:
          $ref: '#/components/schemas/EcheanceFiscaleStatutEnum'
    PlateformeEnum:
      enum:
      - ANDROID
      - IOS
      - WEB
      type: string
      description: |-
        * `ANDROID` - Android
        * `IOS` - iOS
        * `WEB` - Web
    Register:
      type: object
      description: Inscription utilisateur + entreprise + abonnement.
      properties:
        full_name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        company_name:
          type: string
          maxLength: 255
        secteur_id:
          type: string
          format: uuid
          nullable: true
        type_activite:
          type: string
          maxLength: 50
        type_entreprise:
          type: string
          maxLength: 50
        adresse:
          type: string
        devise:
          type: string
          default: XOF
        phone_number:
          type: string
          maxLength: 50
        plan_id:
          type: string
          format: uuid
        mode_paiement:
          type: string
          maxLength: 50
      required:
      - company_name
      - email
      - full_name
      - mode_paiement
      - plan_id
      - type_activite
      - type_entreprise
    RegisterRequest:
      type: object
      description: Inscription utilisateur + entreprise + abonnement.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 8
        confirm_password:
          type: string
          writeOnly: true
          minLength: 1
        company_name:
          type: string
          minLength: 1
          maxLength: 255
        secteur_id:
          type: string
          format: uuid
          nullable: true
        type_activite:
          type: string
          minLength: 1
          maxLength: 50
        type_entreprise:
          type: string
          minLength: 1
          maxLength: 50
        adresse:
          type: string
        devise:
          type: string
          minLength: 1
          default: XOF
        phone_number:
          type: string
          maxLength: 50
        plan_id:
          type: string
          format: uuid
        mode_paiement:
          type: string
          minLength: 1
          maxLength: 50
      required:
      - company_name
      - confirm_password
      - email
      - full_name
      - mode_paiement
      - password
      - plan_id
      - type_activite
      - type_entreprise
    SourceEnum:
      enum:
      - WHATSAPP
      - MOBILE
      - API
      type: string
      description: |-
        * `WHATSAPP` - WHATSAPP
        * `MOBILE` - MOBILE
        * `API` - API
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    TransactionPayloadRequest:
      type: object
      description: Validation de la requête entrante.
      properties:
        text:
          type: string
        image:
          type: string
          format: binary
        audio:
          type: string
          format: binary
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          default: API
    TypeEcheanceEnum:
      enum:
      - TVA
      - TPU_ACOMPTE
      - LIASSE_ANNUELLE
      - DAS
      - AUTRE
      type: string
      description: |-
        * `TVA` - Déclaration TVA (Mensuel)
        * `TPU_ACOMPTE` - Acompte TPU / Patente (Trimestriel)
        * `LIASSE_ANNUELLE` - Bilan Annuel / Liasse SYSCOHADA
        * `DAS` - Déclaration Annuelle des Salaires
        * `AUTRE` - Autre obligation OTR
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
