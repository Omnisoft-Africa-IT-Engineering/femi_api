openapi: 3.0.3
info:
  title: Femi Financial API
  version: 1.0.0
  description: API REST pour l'agent financier et comptable Femi (Mobile & WhatsApp)
paths:
  /api/v1/auth/token/:
    post:
      operationId: v1_auth_token_create
      description: Authentifie un utilisateur et renvoie un token DRF.
      summary: Se connecter et obtenir un token
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: test_api
                password:
                  type: string
                  example: test1234
              required:
              - username
              - password
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/dashboard/kpis/:
    get:
      operationId: v1_dashboard_kpis_retrieve
      description: Renvoie les métriques financières agrégées.
      summary: Récupérer les KPIs du Dashboard
      parameters:
      - in: query
        name: period
        schema:
          type: string
          enum:
          - last_month
          - this_month
          - this_year
          - today
          default: this_month
        description: Période d'analyse des métriques
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/health/:
    get:
      operationId: v1_health_retrieve
      description: Endpoint public de healthcheck.
      summary: Vérifier l'état de l'API
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/kpi/{numero}/:
    get:
      operationId: v1_kpi_retrieve
      description: Renvoie les KPI du niveau demandé, filtrés par secteur, avec valeur
        calculée si disponible.
      summary: KPI d'un niveau donné (catalogue Kpi)
      parameters:
      - in: path
        name: numero
        schema:
          type: integer
        required: true
      - in: query
        name: period
        schema:
          type: string
          enum:
          - last_month
          - this_month
          - this_year
          - today
          default: this_month
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/transactions/batch/:
    post:
      operationId: v1_transactions_batch_create
      description: Synchronise plusieurs transactions saisies hors-ligne.
      summary: Soumettre des transactions par lot
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchTransactionPayload'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/transactions/export/:
    get:
      operationId: v1_transactions_export_retrieve
      description: Génère un export financier.
      summary: Exporter les opérations (PDF ou Excel)
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: export_format
        schema:
          type: string
          enum:
          - pdf
          - xlsx
          default: xlsx
        description: Format du fichier exporté
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/transactions/process/:
    post:
      operationId: v1_transactions_process_create
      description: Reçoit une saisie utilisateur, l'analyse via l'agent et enregistre
        la transaction ou renvoie une réponse.
      summary: Traiter une entrée (Texte, Audio, Image)
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransactionPayload'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransactionPayload'
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionPayload'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationModel'
          description: ''
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '500':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    BatchTransactionItem:
      type: object
      description: Un élément d'une soumission par lot (texte uniquement — pas d'image/audio
        en lot pour l'instant).
      properties:
        text:
          type: string
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          default: MOBILE
        client_ref:
          type: string
      required:
      - text
    BatchTransactionPayload:
      type: object
      description: Validation d'une soumission par lot (app mobile hors-ligne -> sync).
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/BatchTransactionItem'
      required:
      - transactions
    OperationModel:
      type: object
      description: Format de sortie de l'opération enregistrée.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        transaction_type:
          $ref: '#/components/schemas/TransactionTypeEnum'
        amount_ttc:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        currency:
          type: string
          maxLength: 10
        category:
          type: string
          nullable: true
          maxLength: 100
        payment_method:
          type: string
          nullable: true
          maxLength: 50
        transaction_date:
          type: string
          format: date
        description:
          type: string
          nullable: true
        vendor_or_client:
          type: string
          nullable: true
          maxLength: 255
        source:
          type: string
          nullable: true
          maxLength: 50
        statut_paiement:
          $ref: '#/components/schemas/StatutPaiementEnum'
        montant_paye:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Cumul des paiements reçus. Pour une opération PAYE, correspond
            au montant total (voir save()).
        entreprise:
          type: string
          format: uuid
        contact:
          type: string
          format: uuid
          nullable: true
      required:
      - amount_ttc
      - entreprise
      - id
      - transaction_date
      - transaction_type
    SourceEnum:
      enum:
      - WHATSAPP
      - MOBILE
      - API
      type: string
      description: |-
        * `WHATSAPP` - WHATSAPP
        * `MOBILE` - MOBILE
        * `API` - API
    StatutPaiementEnum:
      enum:
      - PAYE
      - CREDIT
      type: string
      description: |-
        * `PAYE` - Payé
        * `CREDIT` - À crédit
    TransactionPayload:
      type: object
      description: Validation de la requête entrante.
      properties:
        text:
          type: string
        image:
          type: string
          format: uri
          nullable: true
        audio:
          type: string
          format: uri
          nullable: true
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          default: API
    TransactionTypeEnum:
      enum:
      - RECETTE
      - DEPENSE
      - PRET_DONNE
      - PRET_RECU
      type: string
      description: |-
        * `RECETTE` - Recette
        * `DEPENSE` - Dépense
        * `PRET_DONNE` - Prêt donné
        * `PRET_RECU` - Prêt reçu
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
